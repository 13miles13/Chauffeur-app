<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chauffeur Privé</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simulateur Chauffeur</h1>

    <form id="formCourse">
      <label>Adresse de départ :</label>
      <input id="depart" type="text" placeholder="Ex: Paris Gare du Nord" autocomplete="off" />

      <label>Adresse d’arrivée :</label>
      <input id="arrivee" type="text" placeholder="Ex: Aéroport Charles de Gaulle" autocomplete="off" />

      <button type="submit">Calculer le prix</button>
    </form>

    <div class="result" id="result"></div>
  </div>

  <script>
    async function getCoordinates(address) {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
      const data = await res.json();
      return data[0] ? [parseFloat(data[0].lon), parseFloat(data[0].lat)] : null;
    }

    async function getDistanceKm(depart, arrivee) {
      try {
        const coordDepart = await getCoordinates(depart);
        const coordArrivee = await getCoordinates(arrivee);
        if (!coordDepart || !coordArrivee) throw new Error("Adresses invalides");

        const res = await fetch("/api/distance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: [coordDepart, coordArrivee] })
        });

        const data = await res.json();
        return data?.routes?.[0]?.summary?.distance / 1000 || null;
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    document.getElementById("formCourse").addEventListener("submit", async e => {
      e.preventDefault();
      const depart = document.getElementById("depart").value.trim();
      const arrivee = document.getElementById("arrivee").value.trim();

      if (!depart || !arrivee) return alert("Merci de remplir les deux adresses.");

      document.getElementById("result").textContent = "Calcul en cours...";

      const distanceKm = await getDistanceKm(depart, arrivee);
      if (!distanceKm) return document.getElementById("result").textContent = "Erreur de calcul.";

      const prix = Math.max(10, (distanceKm * 1.8).toFixed(2));
      document.getElementById("result").innerHTML = `
        Distance : ${distanceKm.toFixed(1)} km<br>
        Prix estimé : <strong>${prix} €</strong>
      `;
    });
  </script>
</body>
</html>
