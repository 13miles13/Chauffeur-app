<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chauffeur Privé VTC Marseille & Aix en Provence</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
/* (styling identical to latest version we agreed) */
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f2f5; color:#333; }
.container { max-width:450px; margin:25px auto; background:#fff; border-radius:20px; padding:30px; box-shadow:0 10px 25px rgba(0,0,0,0.15); }
h1 { text-align:center; font-size:1.8em; color:#1a1a1a; margin-bottom:15px; }
.info-payment { text-align:center; font-size:0.9em; color:#555; margin-bottom:20px; }
label { display:block; font-weight:600; margin-top:12px; font-size:0.95em; }
input, select, button { width:100%; padding:12px; margin-top:5px; border-radius:10px; border:1px solid #ccc; font-size:0.95em; box-sizing:border-box; }
input:focus { outline:none; border-color:#0066cc; box-shadow:0 0 5px rgba(0,102,204,0.3); }
.autocomplete-items { position:absolute; background:white; border:1px solid #ccc; border-top:none; z-index:99; max-height:150px; overflow-y:auto; width:100%; font-size:0.85em; border-radius:0 0 6px 6px; }
.autocomplete-item { padding:6px 10px; cursor:pointer; line-height:1.2; }
.autocomplete-item:hover { background:#e0f0ff; }
button { background:linear-gradient(90deg,#0066cc,#004999); color:white; border:none; margin-top:18px; cursor:pointer; font-size:1em; font-weight:600; border-radius:10px; transition:0.3s; }
button:hover { transform:translateY(-2px); box-shadow:0 6px 15px rgba(0,0,0,0.2); }
.checkbox-label { display:flex; align-items:center; margin-top:12px; cursor:pointer; font-size:0.95em; }
.checkbox-label input { margin-right:8px; transform:scale(1.2); accent-color:#0066cc; }
#datetimeFields { margin-top:5px; }
.hidden { display:none; }
.result { margin-top:15px; text-align:left; font-size:0.95em; background:#e6f0ff; padding:12px; border-radius:10px; font-weight:600; }
.footer { text-align:center; margin-top:25px; font-size:0.9em; color:#555; }
.footer a { color:#0066cc; text-decoration:none; }
.position-relative { position:relative; }
</style>
</head>
<body>
<div class="container">
<h1>Simulateur Chauffeur Privé</h1>
<div class="info-payment">💳 Paiement directement avec le chauffeur : carte bancaire, espèces ou crypto (BTC, USDT)</div>

<form id="formCourse">
<div class="position-relative">
<label>Adresse de départ :</label>
<input id="depart" type="text" placeholder="Ex: Marseille Gare Saint-Charles" autocomplete="off">
<div id="depart-list" class="autocomplete-items"></div>
</div>

<div class="position-relative">
<label>Adresse d’arrivée :</label>
<input id="arrivee" type="text" placeholder="Ex: Aéroport Marseille Provence" autocomplete="off">
<div id="arrivee-list" class="autocomplete-items"></div>
</div>

<label class="checkbox-label">
<input type="checkbox" id="nowCheckbox" checked> Réserver pour tout de suite
</label>

<div id="datetimeFields" class="hidden">
<label>Date :</label>
<input type="date" id="date">
<label>Heure :</label>
<input type="time" id="time">
</div>

<button type="submit">Calculer le prix</button>
</form>

<div class="result" id="result"></div>
</div>

<div class="footer">
📞 Contact : <a href="tel:+33000000000">+33 0X XX XX XX XX</a><br>
✉️ Email : <a href="mailto:contact@chauffeur-prive.fr">contact@chauffeur-prive.fr</a>
</div>

<script>
// Autocomplete + distance calc + save in sessionStorage (majoration hidden)
function setupAutocomplete(id){
  const input = document.getElementById(id);
  const list = document.getElementById(id+"-list");
  input.addEventListener("input", async function(){
    list.innerHTML="";
    if(this.value.length<3) return;
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(this.value)}&limit=5`);
      const data = await res.json();
      data.forEach(place=>{
        const div = document.createElement("div");
        div.textContent = place.display_name;
        div.classList.add("autocomplete-item");
        div.addEventListener("click", ()=>{ input.value=place.display_name; list.innerHTML=""; });
        list.appendChild(div);
      });
    }catch(e){ console.error(e); }
  });
}
setupAutocomplete("depart");
setupAutocomplete("arrivee");

async function getCoordinates(address){
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
  const data = await res.json();
  if(!data[0]) return null;
  return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
}
function calcDistanceKm([lon1,lat1],[lon2,lat2]){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

document.getElementById("formCourse").addEventListener("submit", async e=>{
  e.preventDefault();
  const depart = document.getElementById("depart").value.trim();
  const arrivee = document.getElementById("arrivee").value.trim();
  if(!depart||!arrivee){ alert("Merci de remplir les deux adresses."); return; }

  const coordDepart = await getCoordinates(depart);
  const coordArrivee = await getCoordinates(arrivee);
  if(!coordDepart||!coordArrivee){ alert("Adresses introuvables"); return; }

  let distanceKm = calcDistanceKm(coordDepart,coordArrivee);

  let courseDate = new Date();
  if(!document.getElementById("nowCheckbox").checked){
    const dateInput = document.getElementById("date").value;
    const timeInput = document.getElementById("time").value;
    if(dateInput && timeInput) courseDate = new Date(`${dateInput}T${timeInput}`);
  }

  const hour = courseDate.getHours();
  let prixBase = Math.max(25, distanceKm*2.5); // 2.5€/km base, minimum 25€
  let majoration = 0;
  if((hour>=7 && hour<9)||(hour>=17 && hour<19)) majoration = 0.2;
  if(hour>=22 || hour<6) majoration = 0.3;
  const prixFinal = (prixBase * (1 + majoration)).toFixed(2);

  sessionStorage.setItem("course", JSON.stringify({
    depart, arrivee, distanceKm, prix: prixFinal, majoration, heure: courseDate.toLocaleString()
  }));

  document.getElementById("result").innerHTML = `Distance : ${distanceKm.toFixed(1)} km<br>Prix : <strong>${prixFinal} €</strong><br>Heure : ${courseDate.toLocaleString()}`;

  setTimeout(()=> window.location.href = "confirmation.html", 500);
});
</script>
</body>
</html>
