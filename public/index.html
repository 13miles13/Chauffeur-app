<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chauffeur Privé</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      text-align: center;
    }
    .autocomplete-items {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      z-index: 99;
      max-height: 200px;
      overflow-y: auto;
      width: 100%;
    }
    .autocomplete-item {
      padding: 8px;
      cursor: pointer;
    }
    .autocomplete-item:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simulateur Chauffeur</h1>

    <form id="formCourse">
      <label>Adresse de départ :</label>
      <input id="depart" type="text" placeholder="Ex: Paris Gare du Nord" autocomplete="off" />

      <label>Adresse d’arrivée :</label>
      <input id="arrivee" type="text" placeholder="Ex: Aéroport Charles de Gaulle" autocomplete="off" />

      <button type="submit">Calculer le prix</button>
    </form>

    <div class="result" id="result"></div>
  </div>

  <script>
    // === Autocomplétion OpenStreetMap (Nominatim) ===
    async function autocomplete(inputId) {
      const input = document.getElementById(inputId);
      const listId = inputId + "-list";
      let list = document.createElement("div");
      list.setAttribute("id", listId);
      list.setAttribute("class", "autocomplete-items");
      input.parentNode.appendChild(list);

      input.addEventListener("input", async function() {
        const val = this.value;
        list.innerHTML = "";
        if (!val || val.length < 3) return;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&addressdetails=1&limit=5`);
          const data = await res.json();
          data.forEach(place => {
            const item = document.createElement("div");
            item.textContent = place.display_name;
            item.classList.add("autocomplete-item");
            item.addEventListener("click", () => {
              input.value = place.display_name;
              list.innerHTML = "";
            });
            list.appendChild(item);
          });
        } catch (e) {
          console.error("Erreur autocomplétion :", e);
        }
      });
    }
    autocomplete("depart");
    autocomplete("arrivee");

    // === Fonction pour calculer la distance ===
    async function getDistanceKm(depart, arrivee) {
      try {
        const geoDepart = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(depart)}`);
        const geoArrivee = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(arrivee)}`);
        const [coordDepart] = await geoDepart.json();
        const [coordArrivee] = await geoArrivee.json();

        if (!coordDepart || !coordArrivee) throw new Error("Adresses invalides.");

        const coords = [[coordDepart.lon, coordDepart.lat], [coordArrivee.lon, coordArrivee.lat]];
        const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "5b3ce3597851110001cf6248e1a7a0e0b6f5452f5b79b2d2c8b7f9e0"
          },
          body: JSON.stringify({ coordinates: coords })
        });

        const data = await res.json();
        const meters = data.routes[0].summary.distance;
        return meters / 1000; // km
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    // === Gestion du formulaire ===
    document.getElementById("formCourse").addEventListener("submit", async e => {
      e.preventDefault();
      const depart = document.getElementById("depart").value.trim();
      const arrivee = document.getElementById("arrivee").value.trim();

      if (!depart || !arrivee) return alert("Merci de remplir les deux adresses.");

      document.getElementById("result").textContent = "Calcul en cours...";

      const distanceKm = await getDistanceKm(depart, arrivee);
      if (!distanceKm) return document.getElementById("result").textContent = "Erreur de calcul.";

      const prix = Math.max(10, (distanceKm * 1.8).toFixed(2));
      document.getElementById("result").innerHTML = `
        Distance : ${distanceKm.toFixed(1)} km<br>
        Prix estimé : <strong>${prix} €</strong>
      `;
    });
  </script>
</body>
</html>
