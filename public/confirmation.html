<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation Chauffeur Privé</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f2f5; color:#333; }
.container { max-width:420px; margin:25px auto; background:#fff; border-radius:16px; padding:25px; box-shadow:0 8px 20px rgba(0,0,0,0.15); }
h1 { text-align:center; font-size:1.7em; color:#1a1a1a; margin-bottom:8px; }
label { display:block; font-weight:600; margin-top:12px; font-size:0.95em; }
input, button { width:100%; padding:12px; margin-top:5px; border-radius:8px; border:1px solid #ccc; font-size:0.95em; }
input:focus { outline:none; border-color:#0066cc; box-shadow:0 0 5px rgba(0,102,204,0.3); }
button { background:linear-gradient(90deg,#0066cc,#004999); color:white; border:none; margin-top:18px; cursor:pointer; font-size:1em; font-weight:600; border-radius:8px; transition:0.3s; }
button:hover { transform:translateY(-2px); box-shadow:0 6px 15px rgba(0,0,0,0.2); }
.result { margin-top:15px; text-align:center; font-size:0.95em; background:#e6f0ff; padding:10px; border-radius:8px; font-weight:600; }
.footer { text-align:center; margin-top:25px; font-size:0.9em; color:#555; }
.footer a { color:#0066cc; text-decoration:none; }
</style>
</head>
<body>
<div class="container">
<h1>Confirmation de votre course</h1>
<div id="recap" class="result"></div>

<form id="confirmForm">
<label>Nom :</label>
<input type="text" id="nom" required>
<label>Prénom :</label>
<input type="text" id="prenom" required>
<label>Téléphone :</label>
<input type="tel" id="phone" placeholder="+33XXXXXXXXX" required pattern="^\+33[1-9]\d{8}$">

<button type="submit">Accepter le devis</button>
</form>

<div id="messageFinal" class="result" style="display:none;"></div>
</div>

<div class="footer">
📞 Contact : <a href="tel:+33000000000">+33 0X XX XX XX XX</a><br>
✉️ Email : <a href="mailto:contact@chauffeur-prive.fr">contact@chauffeur-prive.fr</a>
</div>

<script>
const recapDiv = document.getElementById("recap");
const form = document.getElementById("confirmForm");
const messageFinal = document.getElementById("messageFinal");

// Récupération des données de la course depuis sessionStorage
const course = JSON.parse(sessionStorage.getItem("course") || "{}");
if(course && Object.keys(course).length>0){
  recapDiv.innerHTML=`
    <strong>Départ :</strong> ${course.depart}<br>
    <strong>Arrivée :</strong> ${course.arrivee}<br>
    <strong>Distance :</strong> ${course.distanceKm.toFixed(1)} km<br>
    <strong>Prix :</strong> ${course.prix} € ${course.majoration!=='Aucune'?`(${course.majoration})`:''}<br>
    <strong>Heure :</strong> ${course.heure}
  `;
}

// Formulaire confirmation
form.addEventListener("submit", async e=>{
  e.preventDefault();
  const nom = document.getElementById("nom").value.trim();
  const prenom = document.getElementById("prenom").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if(!nom || !prenom){ alert("Nom et prénom obligatoires"); return; }
  const phoneRegex = /^\+33[1-9]\d{8}$/;
  if(!phoneRegex.test(phone)){ alert("Numéro de téléphone mal écrit, format +33XXXXXXXXX"); return; }

  try{
    // Envoi email
    const emailRes = await fetch("/api/send-email",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        to: phone.includes("@")?phone:"client@example.com", // Remplacer par email réel
        subject: "Confirmation de votre course",
        html: `
          Bonjour ${prenom} ${nom},<br>
          Votre course de ${course.depart} à ${course.arrivee} est confirmée.<br>
          Distance : ${course.distanceKm.toFixed(1)} km<br>
          Prix : ${course.prix} € ${course.majoration!=='Aucune'?`(${course.majoration})`:''}<br>
          Heure : ${course.heure}
        `
      })
    });
    const emailData = await emailRes.json();
    console.log("Email envoyé :", emailData);

    // Envoi SMS
    const smsRes = await fetch("/api/send-sms",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        to: phone,
        message: `Bonjour ${prenom}, votre course de ${course.depart} à ${course.arrivee} est confirmée. Prix: ${course.prix} €. Un chauffeur vous contactera bientôt.`
      })
    });
    const smsData = await smsRes.json();
    console.log("SMS envoyé :", smsData);

    messageFinal.style.display="block";
    messageFinal.innerHTML="✅ accepté ! SMS et email envoyés (⚠️ vérifiez vos spam s'il n'apparaît pas dans votre boîte de réception), un chauffeur vous contactera dans un instant, 📱 restez proche de votre téléphone.";
    form.style.display="none";

  }catch(err){
    console.error("Erreur confirmation :", err);
    alert("Une erreur est survenue lors de l'envoi, vérifiez le numéro et réessayez.");
  }
});
</script>
</body>
</html>
