<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation du Devis – Chauffeur Privé</title>
<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:0; }
.container { max-width:500px; margin:40px auto; background:#fff; border-radius:12px; padding:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
h1 { text-align:center; color:#2c3e50; }
label { display:block; font-weight:bold; margin-top:10px; }
input[type=text], input[type=tel], input[type=email] { width:100%; padding:10px; margin-top:5px; border-radius:8px; border:1px solid #ccc; }
button { width:100%; padding:12px; background-color:#007bff; color:white; border:none; border-radius:8px; margin-top:20px; cursor:pointer; font-size:16px; }
button:hover { background-color:#0056b3; }
.checkbox-label { display:flex; align-items:center; margin-top:15px; cursor:pointer; }
.checkbox-label input { margin-right:10px; transform: scale(1.2); }
.result { margin-top:20px; text-align:center; }
</style>
</head>
<body>
<div class="container">
<h1>Confirmation du Devis</h1>

<div id="recap"></div>

<form id="confirmForm">
<label>Nom :</label>
<input type="text" id="nom" required placeholder="Votre nom">

<label>Prénom :</label>
<input type="text" id="prenom" required placeholder="Votre prénom">

<label>Email :</label>
<input type="email" id="email" required placeholder="Ex: nom@exemple.com">

<label>Téléphone :</label>
<input type="tel" id="tel" required placeholder="Ex: 0612345678 ou +33612345678"
       pattern="^(\+33|0)[67]\d{8}$"
       title="Ex: 0612345678 ou +33612345678">

<label class="checkbox-label"><input type="checkbox" id="confirmCheck" required />J’accepte que mes coordonnées soient utilisées pour contacter le chauffeur</label>

<button type="submit">Accepter le devis</button>
</form>

<div class="result" id="result"></div>
</div>

<script>
// Afficher le récapitulatif
const recapDiv = document.getElementById("recap");
const course = JSON.parse(sessionStorage.getItem("course") || "{}");

if(course && course.depart && course.arrivee){
  recapDiv.innerHTML = `
    <p><strong>Départ :</strong> ${course.depart}</p>
    <p><strong>Arrivée :</strong> ${course.arrivee}</p>
    <p><strong>Distance :</strong> ${course.distanceKm.toFixed(1)} km</p>
    <p><strong>Prix :</strong> ${course.prix} € (${course.majoration})</p>
    <p><strong>Heure de la course :</strong> ${course.heure}</p>
  `;
}

// --- Formulaire ---
document.getElementById("confirmForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const nom = document.getElementById("nom").value.trim();
  const prenom = document.getElementById("prenom").value.trim();
  let tel = document.getElementById("tel").value.trim();
  tel = tel.replace(/[^\d\+]/g,""); // Nettoyage
  const email = document.getElementById("email").value.trim();
  const check = document.getElementById("confirmCheck").checked;

  if(!nom || !prenom || !tel || !email || !check){
    alert("Merci de remplir tous les champs et d'accepter l'utilisation de vos coordonnées.");
    return;
  }

  // Envoi SMS
  try{
    await fetch("/api/send-sms", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        to: tel,
        message: `Bonjour ${prenom}, votre réservation chauffeur pour ${course.depart} → ${course.arrivee} est confirmée. Prix : ${course.prix} €.`
      })
    });
  }catch(err){ console.error("Erreur SMS:", err); }

  // Envoi Email
  try{
    await fetch("/api/send-email",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        to: email,
        subject: "Confirmation de votre réservation chauffeur",
        html: `
          <p>Bonjour ${prenom},</p>
          <p>Votre réservation chauffeur pour <strong>${course.depart} → ${course.arrivee}</strong> est confirmée.</p>
          <p>Distance : ${course.distanceKm.toFixed(1)} km<br>Prix : ${course.prix} € (${course.majoration})<br>Heure : ${course.heure}</p>
          <p>Merci de votre confiance !</p>
        `
      })
    });
  }catch(err){ console.error("Erreur email:", err); }

  document.getElementById("result").textContent="✅ Devis accepté ! SMS et email envoyés.";
});
</script>
</body>
</html>
