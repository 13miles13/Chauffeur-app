<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation Devis Chauffeur Privé</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f2f5; color:#333; }
.container { max-width:420px; margin:25px auto; background:#fff; border-radius:16px; padding:25px; box-shadow:0 8px 20px rgba(0,0,0,0.15); }
h1 { text-align:center; font-size:1.7em; color:#1a1a1a; margin-bottom:20px; }
label { display:block; font-weight:600; margin-top:12px; font-size:0.95em; }
input { width:100%; padding:12px; margin-top:5px; border-radius:8px; border:1px solid #ccc; font-size:0.95em; }
input:focus { outline:none; border-color:#0066cc; box-shadow:0 0 5px rgba(0,102,204,0.3); }
button { background:linear-gradient(90deg,#0066cc,#004999); color:white; border:none; margin-top:18px; cursor:pointer; font-size:1em; font-weight:600; border-radius:8px; transition:0.3s; width:100%; padding:14px; }
button:hover { transform:translateY(-2px); box-shadow:0 6px 15px rgba(0,0,0,0.2); }
.checkbox-label { display:flex; align-items:center; margin-top:12px; cursor:pointer; font-size:0.95em; flex-wrap:nowrap; }
.checkbox-label input { margin-right:8px; transform:scale(1.2); accent-color:#0066cc; }
.result { background:#e6f0ff; padding:12px; border-radius:8px; font-weight:600; margin-bottom:15px; font-size:0.95em; }
.error { color:red; font-size:0.9em; margin-top:5px; }
</style>
</head>
<body>
<div class="container">
<h1>Confirmation du Devis</h1>

<div class="result" id="recap"></div>

<form id="confirmForm">
<label>Nom :</label>
<input type="text" id="nom" required>

<label>Prénom :</label>
<input type="text" id="prenom" required>

<label>Email :</label>
<input type="email" id="email" required>

<label>Téléphone :</label>
<input type="tel" id="phone" placeholder="Ex: 06XXXXXXXX" required>

<label class="checkbox-label">
<input type="checkbox" id="acceptCheckbox" required>
J’accepte que mes coordonnées soient utilisées pour la réservation
</label>

<div class="error" id="formError"></div>

<button type="submit">Accepter le devis</button>
<div id="successMsg" style="margin-top:12px;font-weight:600;color:green;"></div>
</form>
</div>

<script>
// Récup course depuis sessionStorage
const recapDiv = document.getElementById("recap");
const course = JSON.parse(sessionStorage.getItem("course")||"{}");
if(course.depart) {
  recapDiv.innerHTML = `
    📍 Départ : ${course.depart}<br>
    📍 Arrivée : ${course.arrivee}<br>
    🛣️ Distance : ${course.distanceKm.toFixed(1)} km<br>
    💶 Prix : ${course.prix} € (${course.majoration})<br>
    ⏰ Heure : ${course.heure}
  `;
}

// Validation formulaire
document.getElementById("confirmForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const nom = document.getElementById("nom").value.trim();
  const prenom = document.getElementById("prenom").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const accept = document.getElementById("acceptCheckbox").checked;
  const errorDiv = document.getElementById("formError");
  errorDiv.textContent="";

  if(!nom||!prenom||!email||!phone) { errorDiv.textContent="Tous les champs sont obligatoires"; return; }
  const phoneRegex = /^(?:0|\+33)[1-9]\d{8}$/;
  if(!phoneRegex.test(phone)) { errorDiv.textContent="Numéro de téléphone invalide"; return; }
  if(!accept) { errorDiv.textContent="Vous devez accepter l'utilisation de vos coordonnées"; return; }

  // Envoi SMS et Email via backend
  try{
    const payload = {
      nom, prenom, email, phone,
      depart: course.depart, arrivee: course.arrivee,
      distance: course.distanceKm, prix: course.prix, heure: course.heure
    };
    // SMS
    await fetch("/api/send-sms",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:phone,message:`Bonjour ${prenom}, votre réservation de chauffeur de ${course.depart} à ${course.arrivee} pour ${course.prix} € est confirmée.`})});
    // Email
    await fetch("/api/send-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:email,subject:"Confirmation Réservation Chauffeur",html:`<p>Bonjour ${prenom},</p><p>Votre réservation de chauffeur privé de <strong>${course.depart}</strong> à <strong>${course.arrivee}</strong> pour <strong>${course.prix} €</strong> (${course.majoration}) est confirmée.</p><p>Heure : ${course.heure}</p>`})});

    document.getElementById("successMsg").textContent="✅ Devis accepté ! SMS et email envoyés (⚠️ vérifiez vos spam s'il n'apparaît pas dans votre boîte de réception), un chauffeur vous contactera dans un instant, 📱 restez proche de votre téléphone.";
    document.getElementById("confirmForm").reset();
  }catch(err){ errorDiv.textContent="Erreur lors de l'envoi, réessayez plus tard"; console.error(err);}
});
</script>
</body>
</html>
