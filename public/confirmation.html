<!-- public/confirmation.html -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmation Chauffeur Privé</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif;margin:0;background:#f0f2f5;color:#333}
.container{max-width:450px;margin:25px auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 25px rgba(0,0,0,0.15)}
h1{text-align:center;margin-bottom:15px}
label{display:block;font-weight:600;margin-top:12px}
input,button{width:100%;padding:12px;margin-top:5px;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
button{background:linear-gradient(90deg,#0066cc,#004999);color:#fff;border:none;margin-top:20px;border-radius:10px}
.result{margin-top:15px;background:#e6f0ff;padding:12px;border-radius:10px;font-weight:600}
#errorLog{margin-top:12px;color:#b00020;font-size:0.9em;white-space:pre-line}
.footer{text-align:center;margin-top:20px;font-size:0.9em;color:#555}
</style>
</head>
<body>
<div class="container">
<h1>Confirmation de votre course</h1>
<div id="recap" class="result"></div>

<form id="confirmForm">
<label>Nom :</label><input id="nom" required>
<label>Prénom :</label><input id="prenom" required>
<label>Email :</label><input id="email" type="email" required placeholder="exemple@domaine.com">
<label>Téléphone :</label><input id="phone" placeholder="+33XXXXXXXXX" required>
<button type="submit">Accepter le devis</button>
</form>

<div id="messageFinal" class="result" style="display:none"></div>
<div id="errorLog"></div>
</div>
<div class="footer">📞 Contact : <a href="tel:+33000000000">+33 0X XX XX XX XX</a></div>

<script>
const recap = document.getElementById('recap');
const form = document.getElementById('confirmForm');
const messageFinal = document.getElementById('messageFinal');
const errorLog = document.getElementById('errorLog');

function logError(msg){
  const time = new Date().toLocaleTimeString();
  errorLog.textContent += `[${time}] ${msg}\n`;
}

// load course
const course = JSON.parse(sessionStorage.getItem('course') || '{}');
if(course && Object.keys(course).length){
  recap.innerHTML = `<strong>Départ :</strong> ${course.depart}<br><strong>Arrivée :</strong> ${course.arrivee}<br><strong>Distance :</strong> ${Number(course.distanceKm).toFixed(1)} km<br><strong>Prix :</strong> ${course.prix} €<br><strong>Heure :</strong> ${course.heure}`;
} else {
  logError('Aucune course en sessionStorage');
}

form.addEventListener('submit', async e=>{
  e.preventDefault();
  errorLog.textContent = ''; // clear older or keep? we clear to avoid huge logs
  const nom = document.getElementById('nom').value.trim();
  const prenom = document.getElementById('prenom').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if(!nom || !prenom || !email || !phone){ logError('Nom/prénom/email/phone requis'); return; }

  try {
    const payload = { nom, prenom, emailClient: email, phoneClient: phone, course };
    const res = await fetch('/api/confirm-course', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    });

    const text = await res.text().catch(()=>null);
    // try parse JSON safely
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch(e) {
      logError('Réponse serveur non JSON : ' + (text ? text.substring(0,200) : 'empty'));
      return;
    }

    if(!res.ok) {
      logError('Erreur serveur: ' + (data?.error || JSON.stringify(data)));
      return;
    }

    if(data.success){
      messageFinal.style.display='block';
      messageFinal.innerHTML = "✅ Accepté ! SMS et email envoyés (⚠️ vérifiez vos spams). Un chauffeur vous contactera dans un instant, 📱 restez proche de votre téléphone.";
      form.style.display='none';
    } else {
      logError('API responded but success=false: ' + JSON.stringify(data));
    }
  } catch(err) {
    logError('Erreur fetch: ' + err.message);
  }
});
</script>
</body>
</html>
